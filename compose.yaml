name: miniclick

x-node: &node
  image: miniclick:local
  build: .
  environment:
    RUST_LOG: info,openraft=warn
  stop_grace_period: 15s
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "--max-time", "2", "http://127.0.0.1:8123/ping"]
    interval: 2s
    timeout: 3s
    retries: 15
    start_period: 5s

services:
  node1:
    <<: *node
    command: ["--config", "/app/node.toml"]
    ports:
      - "127.0.0.1:${MINICLICK_NODE1_PORT:-8123}:8123"
    volumes:
      - ./deploy/node1.toml:/app/node.toml:ro
      - node1-data:/data

  node2:
    <<: *node
    command: ["--config", "/app/node.toml"]
    ports:
      - "127.0.0.1:${MINICLICK_NODE2_PORT:-8124}:8123"
    volumes:
      - ./deploy/node2.toml:/app/node.toml:ro
      - node2-data:/data

  node3:
    <<: *node
    command: ["--config", "/app/node.toml"]
    ports:
      - "127.0.0.1:${MINICLICK_NODE3_PORT:-8125}:8123"
    volumes:
      - ./deploy/node3.toml:/app/node.toml:ro
      - node3-data:/data

volumes:
  node1-data:
  node2-data:
  node3-data:

# CLI имеет приоритет над TOML. Относительные пути считаются от рабочего каталога.
listen_addr = "127.0.0.1:8123"
data_dir = "./data"
node_id = "node-1"
# Общий идентификатор кластера у лидера и всех его реплик.
cluster_id = "miniclick"
role = "Leader"
# Для реплики: role = "Replica", leader_addr = "127.0.0.1:8123",
# leader_id = "node-1" (ожидаемый node_id лидера).
# sync_interval_ms задаёт период сверки реплики с лидером.
sync_interval_ms = 1000
max_body_bytes = 268435456
# Размер гранулы и кодек пока задаются только в CREATE TABLE ... SETTINGS.

# Статическая карта на отдельном координаторе без [cluster] и роли Replica.
# На каждом шарде создайте hits_local с одинаковой схемой и движком MergeTree.
# Ключ UInt64 направляется в шард по остатку от деления на число шардов.
# Шарды нумеруются для этого расчёта с нуля в порядке возрастания их ID.
# Изменение набора ID для заполненной таблицы потребует переноса данных.
# [sharding.hits]
# local_table = "hits_local"
# key = "user_id"
# shards = { "1" = "shard1:8123", "2" = "shard2:8123" }

# На первом физическом шарде укажите тот же ключ и все ID из карты координатора.
# [local_shards.hits_local]
# key = "user_id"
# shard_id = 1
# shard_ids = [1, 2]

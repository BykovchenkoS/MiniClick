defaults
    mode http
    timeout connect 2s
    timeout client 300s
    timeout server 300s
    timeout check 1s
    # SQL и INSERT используют POST. Незавершённый запрос не отправляется повторно.
    retries 0
    retry-on none

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s

frontend miniclick
    bind :8123
    default_backend coordinators

backend coordinators
    option httpchk GET /ping
    http-check expect status 200
    http-response set-header X-MiniClick-Coordinator %[srv_name]
    default-server check inter 1s fall 2 rise 2 resolvers docker init-addr none
    server coordinator coordinator:8123
    server coordinator-backup coordinator-backup:8123 backup
